name: Rust CI

on:
  pull_request:
    paths:
      - 'rust-core/**'
  push:
    branches: [main]
    paths:
      - 'rust-core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run tests
        run: cargo test
      - name: Run clippy
        run: cargo clippy -- -D warnings